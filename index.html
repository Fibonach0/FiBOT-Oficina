<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina FiBOT</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ef;
    --floor-a: #efe6d3;
    --floor-b: #e6dabf;
    --ink: #1c1b19;
    --muted: #5b584f;
    --green: #2f5233;
    --rule: #d8cfb6;
    --wood: #8a5a3a;
    --wood-dark: #6e4429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Nunito", -apple-system, system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
  }
  header {
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    font-family: "VT323", monospace;
    font-size: 2rem;
    letter-spacing: 1px;
    margin: 0;
    color: var(--green);
  }
  header p { margin: 0; color: var(--muted); font-size: .92rem; }

  .piso {
    position: relative;
    margin: 0 24px 32px;
    border-radius: 14px;
    border: 3px solid var(--wood-dark);
    overflow: hidden;
    background-image:
      repeating-linear-gradient(45deg, var(--floor-a) 0 24px, var(--floor-b) 24px 48px);
    box-shadow: inset 0 0 0 6px var(--wood);
    min-height: 420px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 28px;
    padding: 40px;
    align-items: start;
  }

  .escritorio {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .escritorio:focus-visible .mueble { outline: 3px solid var(--green); outline-offset: 3px; }

  .avatar-wrap { animation: respirar 3.4s ease-in-out infinite; }
  @keyframes respirar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .avatar { width: 58px; height: 58px; display: block; filter: drop-shadow(0 3px 2px rgba(0,0,0,.18)); }

  .mueble {
    width: 128px;
    height: 70px;
    background: linear-gradient(180deg, #b98452, var(--wood));
    border: 3px solid var(--wood-dark);
    border-radius: 8px;
    position: relative;
    box-shadow: 0 4px 0 var(--wood-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mueble::before {
    content: "";
    width: 46px; height: 30px;
    background: #2b2f33;
    border-radius: 3px;
    box-shadow: inset 0 0 0 3px #4a5560;
  }
  .mueble::after {
    content: "";
    position: absolute;
    top: 6px; right: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .estado-activo .mueble::after { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .estado-pausa .mueble::after { background: #d8b23a; }
  .estado-bloqueado .mueble::after { background: #c1652f; }

  .placa {
    font-weight: 800;
    font-size: .95rem;
    margin-top: 2px;
  }
  .nota-corta {
    font-size: .78rem;
    color: var(--muted);
    text-align: center;
    max-width: 170px;
    line-height: 1.25;
  }

  /* panel de detalle */
  .fondo-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(28,27,25,.45);
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .fondo-modal.abierto { display: flex; }
  .panel {
    background: #fff;
    border-radius: 12px;
    border: 1px solid var(--rule);
    max-width: 420px;
    width: 100%;
    padding: 22px 24px;
    position: relative;
  }
  .panel h2 { margin: 4px 0 2px; }
  .panel .rol { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .panel .nota { line-height: 1.45; }
  .panel a.btn {
    display: inline-block;
    margin-top: 16px;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: .9rem;
  }
  .cerrar {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; font-size: 1.3rem;
    cursor: pointer; color: var(--muted);
  }
  .panel .avatar { width: 44px; height: 44px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    padding: 10px 20px 30px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Oficina FiBOT</h1>
    <p>Panel personal — en qué anda cada frente, de un vistazo.</p>
  </div>
</header>

<main class="piso" id="piso" aria-label="Oficina, un escritorio por agente"></main>

<footer>oficina.fibot.ar · datos cargados a mano por ahora, ver <code>agents.json</code></footer>

<div class="fondo-modal" id="fondo-modal">
  <div class="panel" id="panel" role="dialog" aria-modal="true">
    <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
    <div id="panel-avatar-wrap"></div>
    <h2 id="panel-nombre"></h2>
    <p class="rol" id="panel-rol"></p>
    <p class="nota" id="panel-nota"></p>
    <a class="btn" id="panel-link" target="_blank" rel="noopener"></a>
  </div>
</div>

<script>
function avatarSVG(color, extraClass) {
  return `
    <svg class="avatar${extraClass ? ' ' + extraClass : ''}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="34" rx="13" ry="6" fill="${color}"/>
      <circle cx="20" cy="16" r="11" fill="${color}"/>
      <circle cx="16" cy="15" r="1.6" fill="#1c1b19"/>
      <circle cx="24" cy="15" r="1.6" fill="#1c1b19"/>
      <path d="M15 20 Q20 24 25 20" stroke="#1c1b19" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>`;
}

async function cargarAgentes() {
  const res = await fetch("agents.json", { cache: "no-store" });
  const data = await res.json();
  return data.agentes;
}

function crearEscritorio(agente) {
  const btn = document.createElement("button");
  btn.className = `escritorio estado-${agente.estado}`;
  btn.innerHTML = `
    <div class="avatar-wrap">${avatarSVG(agente.color)}</div>
    <div class="mueble"></div>
    <div class="placa">${agente.nombre}</div>
    <div class="nota-corta">${agente.nota}</div>
  `;
  btn.addEventListener("click", () => abrirPanel(agente));
  return btn;
}

function abrirPanel(agente) {
  document.getElementById("panel-avatar-wrap").innerHTML = avatarSVG(agente.color);
  document.getElementById("panel-nombre").textContent = agente.nombre;
  document.getElementById("panel-rol").textContent = agente.rol;
  document.getElementById("panel-nota").textContent = agente.nota;
  const link = document.getElementById("panel-link");
  link.href = agente.link;
  link.textContent = agente.link_label || "Ver más";
  document.getElementById("fondo-modal").classList.add("abierto");
}

document.getElementById("cerrar").addEventListener("click", () => {
  document.getElementById("fondo-modal").classList.remove("abierto");
});
document.getElementById("fondo-modal").addEventListener("click", (e) => {
  if (e.target.id === "fondo-modal") e.currentTarget.classList.remove("abierto");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("fondo-modal").classList.remove("abierto");
});

cargarAgentes().then((agentes) => {
  const piso = document.getElementById("piso");
  agentes.forEach((a) => piso.appendChild(crearEscritorio(a)));
}).catch((err) => {
  document.getElementById("piso").textContent = "No se pudo cargar agents.json: " + err.message;
});
</script>
</body>
</html>
